[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-intelligence"
version = "0.1.0"
description = "AI-powered retail demand forecasting and inventory intelligence platform"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["retail_intelligence*"]
namespaces = true
